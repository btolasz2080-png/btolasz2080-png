<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 84" width="520" height="84" role="img" aria-label="Open my interactive portfolio">
<defs>
  <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#A27A33"/><stop offset=".5" stop-color="#F4E3B0"/><stop offset="1" stop-color="#C9A458"/>
    <animate attributeName="x1" values="-1;0;-1" dur="5s" repeatCount="indefinite"/><animate attributeName="x2" values="0;1;0" dur="5s" repeatCount="indefinite"/></linearGradient>
</defs>
<style>
  .ring{fill:none;stroke:#C9A458;stroke-width:1.5;transform-origin:260px 42px;animation:p 2.4s ease-out infinite}
  @keyframes p{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.06,1.35)}}
  .arrow{animation:a 1.6s ease-in-out infinite}@keyframes a{50%{transform:translateX(6px)}}
  text{font-family:'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace;font-weight:600;letter-spacing:2.2px}
</style>
<rect class="ring" x="12" y="12" width="496" height="60" rx="30"/>
<rect x="12" y="12" width="496" height="60" rx="30" fill="#4C050C"/>
<rect x="13" y="13" width="494" height="58" rx="29" fill="none" stroke="url(#g)" stroke-width="1.2"/>
<text x="44" y="48" fill="url(#g)" font-size="15">♛  OPEN MY INTERACTIVE PORTFOLIO</text>
<g class="arrow"><text x="452" y="48" fill="#E3DFCE" font-size="18">→</text></g>
</svg>
